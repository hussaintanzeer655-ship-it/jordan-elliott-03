<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jordan Elliott - Minimal Showcase</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">Jordan</div>
    <nav class="nav" aria-label="Main">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#work">Work</a>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌓</button>
    </nav>
  </header>
  <main id="home" class="panel" aria-label="Intro">
    <div style="text-align:center;max-width:700px;margin:0 auto">
      <h1 style="font-weight:700;margin:0 0 .5rem">Hello, I’m Jordan Elliott</h1>
      <p style="color:var(--muted);margin:0 0 1rem;">A compact, fast portfolio demo with no dependencies.</p>
      <button class="cta" data-scroll-to="#work">View Work</button>
    </div>
  </main>
  <section id="about" class="panel"><h2>About</h2><p>Focus on clarity, accessibility and performance.</p></section>
  <section id="work" class="panel"><h2>Work</h2><ul class="grid"><li class="card">Performance-first UI</li><li class="card">Accessible patterns</li><li class="card">Clean typography</li></ul></section>
  <section id="contact" class="panel"><h2>Contact</h2><form id="contactForm"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Message<textarea name="message" rows="3" required></textarea></label><button type="submit">Send</button></form><p id="formStatus" class="status" aria-live="polite"></p></section>
  <footer class="site-footer">© 2024 Jordan</footer>
  <script src="script.js"></script>
</body>
</html>
